<linkset>
	<html:link rel="localization" href="__addonRef__-preferences.ftl" />
	<html:link rel="stylesheet" href="chrome://__addonRef__/content/preferences.css" />
</linkset>
<vbox id="zotero-prefpane-__addonRef__" onload="Zotero.__addonInstance__.prefsMenu.onPrefsLoad(window)"
	class="main-section">
	<!-- Custom columns -->
	<groupbox>
		<label>
			<html:h2 data-l10n-id="pref-customcolumns-title"></html:h2>
		</label>
		<html:table>
			<html:thead>
				<html:tr>
					<html:th data-l10n-id="pref-customcolumns-header-name"></html:th>
					<html:th data-l10n-id="pref-customcolumns-header-reorder"></html:th>
				</html:tr>
			</html:thead>
			<html:tbody id="custom-columns-table-body"> </html:tbody>
			<html:button id="custom-columns-add"
				onclick="Zotero.__addonInstance__.prefsMenu.addTableRowCustomColumns(window)"
				data-l10n-id="pref-customcolumns-button-add" />
			<br />
			<html:button id="custom-columns-save"
				onclick="Zotero.__addonInstance__.prefsMenu.saveTableCustomColumns(window)"
				data-l10n-id="pref-customcolumns-button-save" />
			<html:button id="custom-columns-reset"
				onclick="Zotero.__addonInstance__.prefsMenu.resetTableCustomColumns(window)"
				data-l10n-id="pref-customcolumns-button-reset" />
		</html:table>
		<html:label data-l10n-id="pref-customcolumns-help"></html:label>
	</groupbox>
	<vbox id="custom-column-sections"></vbox>
</vbox>
<vbox class="main-section">
	<html:label data-l10n-id="pref-help"
		data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'></html:label>
</vbox>
